name: Noise band report

# Results so far. The table shows on the run's own page.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Report
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python3 bot/noise_band_bot.py report --out report
      - uses: actions/upload-artifact@v4
        with:
          name: noise-band-report
          path: report/
