name: Noise band bot

# One long session a day: it starts before 10:00 AM New York, checks every 10
# minutes until 2:00 PM, and if it trades, watches the trade until it sells
# (3:45 PM at the latest). GitHub's clock is UTC and ignores daylight saving, so
# there are summer and winter slots; the bot checks New York time itself. The
# later slots are backups in case GitHub starts the first one late or not at all.
on:
  schedule:
    - cron: "50 13 * * 1-5"   # 9:50 AM New York in summer
    - cron: "50 14 * * 1-5"   # 9:50 AM New York in winter
    - cron: "20 15 * * 1-5"   # backup
    - cron: "20 16 * * 1-5"   # backup
  workflow_dispatch:
    inputs:
      mode:
        description: "status = check the connection. look = one look now, no orders. dry-run = a full session with no orders. run = the real session."
        type: choice
        default: status
        options:
          - status
          - look
          - dry-run
          - run

concurrency:
  group: noise-band-session
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Self-check
        run: python3 -m unittest discover -s tests -p "test_noise_band.py"
      - name: Noise band bot
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
        run: |
          case "$MODE" in
            status)  python3 bot/noise_band_bot.py status ;;
            look)    python3 bot/noise_band_bot.py look ;;
            dry-run) python3 bot/noise_band_bot.py run --dry-run ;;
            *)       python3 bot/noise_band_bot.py run ;;
          esac
